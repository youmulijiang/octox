name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies (gpui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libfontconfig-dev libharfbuzz-dev libasound2-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all
      - run: cargo build --release
      # 无头环境开窗可能失败，仅在 Windows 上跑 smoke 自检
      - name: Smoke test
        if: runner.os == 'Windows'
        run: ./target/release/octox.exe --smoke
